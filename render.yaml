services:
  - type: web
    name: handloom-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "import ml; ml.get_model()"
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
